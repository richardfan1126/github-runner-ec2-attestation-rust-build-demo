[project]
name = "github-runner-ec2-attestation-rust-build-demo"
version = "0.1.0"
description = "Attested Rust Build Pipeline - builds a Rust binary inside an attested AWS Nitro Enclave, signs it with attestation documents, and uploads to GHCR as an OCI artifact"
requires-python = ">= 3.11"

dependencies = [
    "requests>=2.31.0",
    "cbor2>=5.6.0",
    "pycose>=1.0.0",
    "pyOpenSSL>=23.0.0",
    "pycryptodome>=3.19.0",
    "cryptography>=41.0.0",
    "wolfcrypt>=5.7.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0.0",
    "pytest>=7.0.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [".github/scripts/call_remote_executor"]
include = [
    ".github/scripts/call_remote_executor/**/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
